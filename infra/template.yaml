AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Story Engine on AWS, spec 002 Option S (decisions D1-D9, 2026-10-16): us-east-1,
  Anthropic API, Langfuse local only (tracing OFF here), Aurora Serverless v2 via the
  RDS Data API, one Lambda image behind API Gateway REST in STREAM mode, SPA on
  S3 + CloudFront, Route 53 sub-zone. Tasks T010, T011, T020, T022, T031, T036.
  Needs infra/bootstrap.yaml deployed first (OIDC role, ECR, artifact bucket,
  hosted zone, budget) and the zone NS-delegated from Cloudflare (T023), because
  the ACM certificate below validates by DNS in that zone. See docs/runbook-aws.md.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod]
  BootstrapStackName:
    Type: String
    Default: story-engine-bootstrap
    Description: Stack built from infra/bootstrap.yaml; exports the hosted zone id.
  SiteDomain:
    Type: String
    Default: storyteller.techvigilant.com
  ApiDomain:
    Type: String
    Default: api.storyteller.techvigilant.com
  AlarmEmail:
    Type: String
    Description: Address subscribed to the alarm topic (confirm the SNS email once).
  ReservedConcurrency:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Caps parallel stories (cost and abuse ceiling, replaces nginx limits).
  ApiRateLimit:
    Type: Number
    Default: 10
    Description: API Gateway stage steady-state requests per second.
  ApiBurstLimit:
    Type: Number
    Default: 20
  SslcommerzSandbox:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  SemanticCacheEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  AuroraMaxCapacity:
    Type: Number
    Default: 4
    Description: ACU ceiling. Minimum is 0 (D8) with auto-pause after 300 s.

Globals:
  Function:
    Architectures: [arm64]
    Tracing: PassThrough

Resources:

  # ============================================================== T011 Aurora
  # Aurora always needs a DB subnet group over >= 2 AZs, even when nothing is
  # VPC-attached (Doctor-Assist live finding T014). This VPC has no internet
  # gateway, no NAT and no route out: Data API traffic never enters it.
  AuroraVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.98.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-aurora'}]

  AuroraSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AuroraVpc
      CidrBlock: 10.98.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  AuroraSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AuroraVpc
      CidrBlock: 10.98.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  AuroraSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Aurora Serverless v2, AZ coverage only, no traffic routed here
      SubnetIds: [!Ref AuroraSubnetA, !Ref AuroraSubnetB]

  # Scale to zero needs Aurora PostgreSQL >= 16.3. RDS owns the master secret in
  # Secrets Manager (~$0.40/month): the Data API authenticates with a secret ARN,
  # SSM parameters cannot be used for that.
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: '16.11'   # 16.1-16.6 are deprecated for new clusters (cfn-lint W3690)
      DatabaseName: storyengine
      MasterUsername: storyengine_admin
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true
      DBSubnetGroupName: !Ref AuroraSubnetGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: !Ref AuroraMaxCapacity
        SecondsUntilAutoPause: 300
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '20:00-21:00'
      CopyTagsToSnapshot: true
      StorageEncrypted: true
      DeletionProtection: true

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref AuroraCluster
      PubliclyAccessible: false

  # ============================================================== T010 / T020 Lambda
  # Runtime config contract with the app (worker-aws-app, T013-T021):
  # - secrets: SecureString parameters under SSM_PARAMETER_PATH, read once at cold
  #   start (CloudFormation cannot create SecureStrings and Lambda env vars cannot
  #   use ssm-secure references; the runbook creates them). Names = Settings fields:
  #   ANTHROPIC_API_KEY, JWT_SECRET_KEY, SSLCOMMERZ_STORE_ID, SSLCOMMERZ_STORE_PASS.
  # - database: DB_BACKEND=dataapi + AURORA_* (no DATABASE_URL, no password).
  # - tracing: TRACING_ENABLED=false, no LANGFUSE_* keys (D5); prod_guard must
  #   accept that instead of demanding Langfuse keys.
  StoryApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-story-api'
      PackageType: Image
      Description: FastAPI + LangGraph behind Lambda Web Adapter, response streaming
      MemorySize: 2048
      Timeout: 900
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      AutoPublishAlias: live
      DeploymentPreference:
        # T031: CodeDeploy publishes the new version, runs the migrate hook
        # (alembic upgrade head) BEFORE any traffic moves, then shifts the live
        # alias at once. A failed hook or a firing alarm rolls the alias back.
        Type: AllAtOnce
        Hooks:
          PreTraffic: !Ref MigrateFunction
        Alarms:
          - !Ref StoryApiErrorsAlarm
      Environment:
        Variables:
          APP_ENV: production
          LLM_PROVIDER: anthropic
          TRACING_ENABLED: 'false'
          DB_BACKEND: dataapi
          AURORA_CLUSTER_ARN: !GetAtt AuroraCluster.DBClusterArn
          AURORA_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          AURORA_DATABASE: storyengine
          SSM_PARAMETER_PATH: !Sub '/story-engine/${Stage}/'
          CHECKPOINTER: none
          REDIS_URL: ''
          FRONTEND_URL: !Sub 'https://${SiteDomain}'
          BACKEND_PUBLIC_URL: !Sub 'https://${ApiDomain}'
          BACKEND_CORS_ORIGINS: !Sub '["https://${SiteDomain}"]'
          SSLCOMMERZ_SANDBOX: !Ref SslcommerzSandbox
          SEMANTIC_CACHE_ENABLED: !Ref SemanticCacheEnabled
          RUN_DEADLINE_SECONDS: '600'
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_PORT: '8080'
          AWS_LWA_READINESS_CHECK_PATH: /health
      Policies:
        - Statement:
            # Transactions too: enforce_quota uses SELECT ... FOR UPDATE inside one
            # (Doctor-Assist live bug: BeginTransaction was missing).
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt AuroraCluster.DBClusterArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
            - Effect: Allow
              Action: [ssm:GetParametersByPath, ssm:GetParameters, ssm:GetParameter]
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/story-engine/${Stage}/*'
            # SecureStrings use the AWS-managed aws/ssm key; decrypt only via SSM.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
    Metadata:
      Dockerfile: Dockerfile.lambda
      DockerContext: ../backend
      DockerTag: latest

  # Same image, buffered mode. Lambda Web Adapter forwards a non-HTTP event (the
  # CodeDeploy hook event) as POST AWS_LWA_PASS_THROUGH_PATH; with RUN_MODE=migrate
  # the app mounts only that route: alembic upgrade head over the Data API, then
  # codedeploy:PutLifecycleEventHookExecutionStatus Succeeded/Failed.
  # The name must start with CodeDeployHook_ for SAM's CodeDeploy service role.
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'CodeDeployHook_${AWS::StackName}-migrate'
      PackageType: Image
      Description: alembic upgrade head, run as the CodeDeploy PreTraffic hook
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          APP_ENV: production
          RUN_MODE: migrate
          TRACING_ENABLED: 'false'
          DB_BACKEND: dataapi
          AURORA_CLUSTER_ARN: !GetAtt AuroraCluster.DBClusterArn
          AURORA_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
          AURORA_DATABASE: storyengine
          SSM_PARAMETER_PATH: !Sub '/story-engine/${Stage}/'
          AWS_LWA_INVOKE_MODE: buffered
          AWS_LWA_PORT: '8080'
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LWA_PASS_THROUGH_PATH: /events
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: !GetAtt AuroraCluster.DBClusterArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
            - Effect: Allow
              Action: [ssm:GetParametersByPath, ssm:GetParameters, ssm:GetParameter]
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/story-engine/${Stage}/*'
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
            - Effect: Allow
              Action: codedeploy:PutLifecycleEventHookExecutionStatus
              Resource: !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ServerlessDeploymentApplication}/*'
    Metadata:
      Dockerfile: Dockerfile.lambda
      DockerContext: ../backend
      DockerTag: latest

  StoryApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${StoryApiFunction}'
      RetentionInDays: 14

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${MigrateFunction}'
      RetentionInDays: 14

  # ============================================================== T020 API Gateway
  # REST API, Regional, Lambda proxy with response transfer mode STREAM (the only
  # AWS edge that streams SSE from Lambda: 15 min max, 5 min idle). Streaming
  # needs the 2021-11-15 .../response-streaming-invocations URI. The default
  # execute-api endpoint is off: the only way in is api.storyteller.*.
  # SPIKE FIRST (tasks.md T020): LWA response_stream output behind REST STREAM is
  # unverified; fallback = function URL behind CloudFront (research.md R1).
  StoryApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      StageName: !Ref Stage
      EndpointConfiguration:
        Type: REGIONAL
      DisableExecuteApiEndpoint: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ApiRateLimit
          ThrottlingBurstLimit: !Ref ApiBurstLimit
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: story-engine
          version: '1.0'
        paths:
          /:
            x-amazon-apigateway-any-method:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                responseTransferMode: STREAM
                timeoutInMillis: 900000
                uri: !Sub
                  - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${AliasArn}/response-streaming-invocations'
                  - AliasArn: !Ref StoryApiFunction.Alias
          /{proxy+}:
            x-amazon-apigateway-any-method:
              parameters:
                - name: proxy
                  in: path
                  required: true
                  schema: {type: string}
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                responseTransferMode: STREAM
                timeoutInMillis: 900000
                uri: !Sub
                  - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${AliasArn}/response-streaming-invocations'
                  - AliasArn: !Ref StoryApiFunction.Alias

  StoryApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StoryApiFunction.Alias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${StoryApi}/*'

  # ============================================================== T022 edge
  # One certificate for both names (us-east-1 serves CloudFront and the Regional
  # API). CloudFormation writes the validation CNAMEs into the delegated zone.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref SiteDomain
      SubjectAlternativeNames: [!Ref ApiDomain]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref SiteDomain
          HostedZoneId: {'Fn::ImportValue': !Sub '${BootstrapStackName}-HostedZoneId'}
        - DomainName: !Ref ApiDomain
          HostedZoneId: {'Fn::ImportValue': !Sub '${BootstrapStackName}-HostedZoneId'}

  ApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref ApiDomain
      RegionalCertificateArn: !Ref Certificate
      EndpointConfiguration:
        Types: [REGIONAL]
      SecurityPolicy: TLS_1_2

  ApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Ref ApiDomainName
      RestApiId: !Ref StoryApi
      Stage: !Ref StoryApi.Stage

  ApiAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: {'Fn::ImportValue': !Sub '${BootstrapStackName}-HostedZoneId'}
      Name: !Ref ApiDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

  SpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  SpaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-spa'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Story Engine SPA (API is on api.*, not behind CloudFront)
        Aliases: [!Ref SiteDomain]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: spa
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SpaOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
        # SPA fallback: client-side routes resolve to index.html.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOacRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SpaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SpaDistribution}'

  SiteAliasRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: {'Fn::ImportValue': !Sub '${BootstrapStackName}-HostedZoneId'}
      Name: !Ref SiteDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt SpaDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # fixed CloudFront alias zone

  SiteAliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: {'Fn::ImportValue': !Sub '${BootstrapStackName}-HostedZoneId'}
      Name: !Ref SiteDomain
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SpaDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ============================================================== T036 alarms
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Also the CodeDeploy rollback alarm for a deploy.
  StoryApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: story-api Lambda errors (unhandled exceptions, timeouts)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Sub '${AWS::StackName}-story-api'}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  StoryApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: story-api hit its reserved concurrency
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref StoryApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  StoryApiDurationP95Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: story-api p95 duration above 5 min (app deadline is 600 s)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{Name: FunctionName, Value: !Ref StoryApiFunction}]
      ExtendedStatistic: p95
      Period: 900
      EvaluationPeriods: 1
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Gateway 5XX responses
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - {Name: ApiName, Value: !Sub '${AWS::StackName}-api'}
        - {Name: Stage, Value: !Ref Stage}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Cost guard for D8: if the cluster never reached 0 ACU in 6 hours it is not
  # pausing (something holds a connection) and the bill heads to ~$45/month.
  AuroraNotPausingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Aurora did not pause (min ServerlessDatabaseCapacity > 0 for 6 h)
      Namespace: AWS/RDS
      MetricName: ServerlessDatabaseCapacity
      Dimensions: [{Name: DBClusterIdentifier, Value: !Ref AuroraCluster}]
      Statistic: Minimum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  SiteUrl:
    Value: !Sub 'https://${SiteDomain}'
  ApiUrl:
    Value: !Sub 'https://${ApiDomain}'
  SpaBucketName:
    Value: !Ref SpaBucket
  SpaDistributionId:
    Value: !Ref SpaDistribution
  StoryApiFunctionName:
    Value: !Ref StoryApiFunction
  MigrateFunctionName:
    Value: !Ref MigrateFunction
  AuroraClusterArn:
    Value: !GetAtt AuroraCluster.DBClusterArn
  AuroraSecretArn:
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
