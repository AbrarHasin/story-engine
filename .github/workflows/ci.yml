name: CI

on:
  push:
  pull_request:

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install linters
        run: pip install -r backend/requirements.txt ruff==0.8.4 mypy==1.14.0

      - name: Ruff
        run: ruff check backend/app/

      - name: Mypy
        run: cd backend && mypy app/ --ignore-missing-imports

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend type check
        run: cd frontend && npm ci && npx tsc --noEmit

      - name: Frontend unit tests
        run: cd frontend && npm run test:unit

      - name: Frontend build
        run: cd frontend && npm run build

  # ── Agent unit tests (mocked LLM, no infra needed) ──────────────────────────
  test-agents:
    name: Test — Agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Pytest — agents
        run: cd backend && python -m pytest tests/test_agents.py -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://storyengine:changeme@localhost:5432/storyengine
          REDIS_URL: redis://localhost:6379

  # ── API smoke tests (live postgres + redis via service containers) ───────────
  test-api:
    name: Test — API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: storyengine
          POSTGRES_USER: storyengine
          POSTGRES_PASSWORD: changeme
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U storyengine"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Migrate database
        run: cd backend && python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://storyengine:changeme@localhost:5432/storyengine

      - name: Pytest — API
        run: >-
          cd backend && python -m pytest
          tests/test_api.py tests/test_ownership.py tests/test_payment.py
          tests/test_semantic_cache.py -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://storyengine:changeme@localhost:5432/storyengine
          REDIS_URL: redis://localhost:6379
          LANGFUSE_PUBLIC_KEY: pk-lf-story-engine-dev
          LANGFUSE_SECRET_KEY: sk-lf-story-engine-dev
          LANGFUSE_HOST: http://localhost:3000
