name: CD

# Fires only after CI completes successfully on master.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Deploy — WSL self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, wsl, linux]

    steps:
      - name: Pull latest code
        run: git -C /home/abrar/code/story-engine pull origin master

      - name: Sync Python dependencies
        run: |
          cd /home/abrar/code/story-engine/backend
          .venv/bin/pip install -q --upgrade -r requirements.txt

      - name: Run database migrations
        run: |
          cd /home/abrar/code/story-engine/backend
          .venv/bin/python -m alembic upgrade head

      - name: Restart backend
        run: /home/abrar/code/story-engine/scripts/restart-backend.sh

      - name: Restart frontend
        run: /home/abrar/code/story-engine/scripts/restart-frontend.sh

      - name: Smoke test
        run: |
          sleep 5
          curl -sf http://localhost:8080/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('Health:', d)
          sys.exit(0 if d['status'] in ('ok','degraded') else 1)
          "
